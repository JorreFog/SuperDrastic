# BananaDS (bananads/): builds it for the PC and for aarch64, runs the host tests on both (aarch64 under qemu), and
# boots the 3D stress-test ROM headless as a smoke test. Only runs when bananads/ or this file changes.
name: bananads
on:
  push:
    branches: [main]
    paths: ['bananads/**', 'stressrom/**', '.github/workflows/bananads.yml']
  pull_request:
    paths: ['bananads/**', 'stressrom/**', '.github/workflows/bananads.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ clang lld llvm python3 pkg-config \
            libsdl2-dev libasound2-dev libenet-dev g++-aarch64-linux-gnu qemu-user
      - name: PC build
        run: |
          cmake -S bananads -B build-pc -DBANANADS_LAN=ON
          cmake --build build-pc -j"$(nproc)"
      - name: Host tests
        run: ctest --test-dir build-pc --output-on-failure
      - name: Smoke test (the stress ROM, headless)
        run: |
          python3 stressrom/build.py
          mkdir -p smoke
          ./build-pc/bananads --frontend headless --set headless.frames=600 --set headless.dump_dir=smoke \
            --set headless.dump_every=600 --set save.dir=smoke --set wifi.dns=off stressrom/out/dsstress-L5.nds \
            2>&1 | tee smoke/log.txt
          grep -q '600 frames' smoke/log.txt
          test -s smoke/frame600.ppm
      - name: Differential harness (the interpreter against itself must match)
        run: ./build-pc/bananads-difftest --frames 120 --b jit=off stressrom/out/dsstress-L3.nds
      - name: aarch64 build
        run: |
          PKG_CONFIG_LIBDIR=/nonexistent cmake -S bananads -B build-a64 \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/bananads/cmake/aarch64-linux-gnu.cmake -DBANANADS_SDL=OFF -DBANANADS_ALSA=OFF
          cmake --build build-a64 -j"$(nproc)"
      - name: aarch64 tests and smoke test (qemu, ARM64 JIT)
        run: |
          qemu-aarch64 -L /usr/aarch64-linux-gnu build-a64/bananads-tests
          qemu-aarch64 -L /usr/aarch64-linux-gnu build-a64/bananads --frontend headless --set headless.frames=120 \
            --set save.dir=smoke --set wifi.dns=off stressrom/out/dsstress-L5.nds 2>&1 | grep '120 frames'
      - name: BananaJIT (aarch64, qemu) gives the interpreter's pictures
        run: |
          PKG_CONFIG_LIBDIR=/nonexistent cmake -S bananads -B build-bj \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/bananads/cmake/aarch64-linux-gnu.cmake -DBANANADS_SDL=OFF -DBANANADS_ALSA=OFF \
            -DBANANADS_JIT=banana
          cmake --build build-bj -j"$(nproc)"
          for j in on off; do
            mkdir -p bj-$j
            qemu-aarch64 -L /usr/aarch64-linux-gnu build-bj/bananads --frontend headless --set jit=$j \
              --set headless.frames=300 --set headless.dump_dir=bj-$j --set headless.dump_every=150 \
              --set save.dir=smoke --set wifi.dns=off --set resume.on_start=off stressrom/out/dsstress-L5.nds
          done
          cmp bj-on/frame150.ppm bj-off/frame150.ppm
          cmp bj-on/frame300.ppm bj-off/frame300.ppm
      - uses: actions/upload-artifact@v4
        with:
          name: bananads-aarch64
          path: |
            build-a64/bananads
            bananads/README.md
            bananads/docs/SETTINGS.md
